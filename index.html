<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<script>
/* ============================================================
   ✏️  EDITA SOLO ESTA PARTE
   ============================================================ */

const CONFIG = {
  paraQuien:   "Mi amor",            // cómo la llamas
  titulo:      "Nuestros 6 meses",
  fechaInicio: "2026-05-09",         // AAAA-MM-DD: el día que empezaron
  firma:       "Te quiero, tu novio" // cómo firmas los mensajes
};

/* Una línea por foto.
   - foto:  ruta de la imagen (pon las fotos en una carpeta "fotos" junto a este archivo)
   - pie:   texto corto que sale debajo de la foto (opcional)
   - texto: el mensaje que aparece al abrirla                                   */
const FOTOS = [
  { foto: "fotos/1.jpg",  pie: "El primer día",      texto: "Aquí empezó todo. Todavía me acuerdo de lo nervioso que estaba y de cómo me sonreíste." },
  { foto: "fotos/2.jpg",  pie: "Nuestra primera cita", texto: "No quería que esa noche se terminara nunca." },
  { foto: "fotos/3.jpg",  pie: "Tu risa",            texto: "Podría escucharte reír todo el día y no me cansaría jamás." },
  { foto: "fotos/4.jpg",  pie: "Ese viaje",          texto: "Contigo cualquier lugar se convierte en mi sitio favorito." },
  { foto: "fotos/5.jpg",  pie: "Domingo cualquiera", texto: "Hasta los días sin plan son perfectos si estás tú." },
  { foto: "fotos/6.jpg",  pie: "Tú",                 texto: "Eres lo más bonito que me ha pasado." },
  { foto: "fotos/7.jpg",  pie: "Nosotros",           texto: "Gracias por elegirme cada día." },
  { foto: "fotos/8.jpg",  pie: "Ese atardecer",      texto: "El cielo estaba precioso, pero yo solo te miraba a ti." },
  { foto: "fotos/9.jpg",  pie: "Locuras",            texto: "Contigo hasta hacer el tonto es mi plan favorito." },
  { foto: "fotos/10.jpg", pie: "Abrazos",            texto: "Mi lugar seguro siempre van a ser tus brazos." },
  { foto: "fotos/11.jpg", pie: "Mi persona",         texto: "No sé cómo tuve tanta suerte de encontrarte." },
  { foto: "fotos/12.jpg", pie: "Lo que viene",       texto: "Estos 6 meses son solo el principio. Lo mejor todavía está por llegar. ❤" }
];

/* ============================================================ */
</script>
<style>
  :root {
    --bg1: #2a1020;
    --bg2: #120812;
    --rosa: #ff7aa8;
    --rosa-suave: #ffd3e2;
    --papel: #fffaf3;
    --tinta: #3b2230;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Quicksand", system-ui, sans-serif;
    color: var(--rosa-suave);
    background: radial-gradient(ellipse at top, var(--bg1), var(--bg2) 70%) fixed;
    background-color: var(--bg2);
    overflow-x: hidden;
  }

  /* corazones flotando */
  .corazones { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .corazones span {
    position: absolute; bottom: -40px; color: var(--rosa); opacity: 0;
    animation: subir linear infinite;
  }
  @keyframes subir {
    0%   { transform: translateY(0) rotate(0); opacity: 0; }
    10%  { opacity: .5; }
    100% { transform: translateY(-110vh) rotate(40deg); opacity: 0; }
  }

  /* pantalla de inicio */
  .inicio {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; text-align: center; padding: 16px;
    background: radial-gradient(ellipse at center, #3a1428, var(--bg2) 75%);
    transition: opacity .9s ease, visibility .9s;
  }
  .inicio.oculto { opacity: 0; visibility: hidden; }
  .inicio .para { font-size: 1.1rem; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
  .inicio h1 { font-family: "Caveat", cursive; font-size: clamp(3rem, 12vw, 6rem); color: #fff; line-height: 1; }
  .latido { font-size: 3.5rem; animation: latir 1.2s ease-in-out infinite; }
  @keyframes latir { 0%,100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
  .boton {
    font: 600 1.1rem "Quicksand", sans-serif; color: #fff; cursor: pointer;
    background: var(--rosa); border: none; border-radius: 999px; padding: 14px 34px;
    box-shadow: 0 8px 30px rgba(255,122,168,.45); transition: transform .2s;
  }
  .boton:hover { transform: scale(1.06); }

  /* cabecera */
  header { position: relative; z-index: 1; text-align: center; padding: 48px 16px 8px; }
  header h2 { font-family: "Caveat", cursive; font-size: clamp(2.6rem, 9vw, 4.5rem); color: #fff; line-height: 1; }
  header p { margin-top: 10px; opacity: .85; }
  .contador { color: var(--rosa); font-weight: 600; }
  .pista { margin-top: 6px; font-size: .9rem; opacity: .6; }

  /* muro de fotos */
  .muro {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 34px 26px; max-width: 1200px; margin: 0 auto; padding: 36px 24px 80px;
  }
  .polaroid {
    background: var(--papel); padding: 12px 12px 0; border-radius: 3px; cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,.45);
    transform: rotate(var(--r)) translateY(30px); opacity: 0;
    transition: transform .35s ease, box-shadow .35s ease;
    position: relative;
  }
  .polaroid.visible { animation: entrar .7s ease forwards; animation-delay: var(--d); }
  @keyframes entrar { to { opacity: 1; transform: rotate(var(--r)) translateY(0); } }
  .polaroid:hover { transform: rotate(0) scale(1.07) !important; box-shadow: 0 18px 40px rgba(0,0,0,.6); z-index: 2; }
  .polaroid::before { /* cinta adhesiva */
    content: ""; position: absolute; top: -12px; left: 50%; width: 70px; height: 24px;
    transform: translateX(-50%) rotate(-3deg);
    background: rgba(255, 211, 226, .55); box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .polaroid img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #eee; }
  .polaroid .pie {
    font-family: "Caveat", cursive; font-size: 1.45rem; color: var(--tinta);
    text-align: center; padding: 8px 4px 12px; min-height: 48px;
  }

  /* ventana con el mensaje */
  .modal {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(10, 4, 10, .82); backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s;
  }
  .modal.abierto { opacity: 1; visibility: visible; }
  .tarjeta {
    background: var(--papel); color: var(--tinta); border-radius: 6px;
    width: min(560px, 100%); max-height: 92vh; overflow-y: auto;
    padding: 16px 16px 22px; box-shadow: 0 25px 60px rgba(0,0,0,.6);
    transform: scale(.9) rotate(-2deg); transition: transform .4s cubic-bezier(.2,1.4,.4,1);
  }
  .modal.abierto .tarjeta { transform: scale(1) rotate(0); }
  .tarjeta img { width: 100%; max-height: 55vh; object-fit: contain; background: #f3ece4; border-radius: 3px; display: block; }
  .tarjeta .mensaje {
    font-family: "Caveat", cursive; font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.25;
    margin-top: 16px; text-align: center; min-height: 2.5em;
  }
  .tarjeta .firma { font-family: "Caveat", cursive; font-size: 1.4rem; text-align: right; color: #c2456f; margin-top: 10px; opacity: 0; transition: opacity .6s; }
  .tarjeta .firma.visible { opacity: 1; }
  .controles { position: fixed; inset: 0; pointer-events: none; }
  .ctrl {
    pointer-events: auto; position: absolute; border: none; cursor: pointer;
    width: 48px; height: 48px; border-radius: 50%; font-size: 1.6rem; line-height: 1;
    background: rgba(255,255,255,.15); color: #fff; transition: background .2s;
  }
  .ctrl:hover { background: var(--rosa); }
  .cerrar { top: 16px; right: 16px; }
  .ant { left: 16px; top: 50%; transform: translateY(-50%); }
  .sig { right: 16px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 640px) {
    .muro { grid-template-columns: repeat(2, 1fr); gap: 26px 16px; padding: 28px 16px 60px; }
    .polaroid { padding: 8px 8px 0; }
    .polaroid .pie { font-size: 1.15rem; min-height: 40px; }
    .ant, .sig { top: auto; bottom: 16px; transform: none; }
  }
</style>
</head>
<body>

<div class="corazones" id="corazones"></div>

<section class="inicio" id="inicio">
  <div class="latido">❤</div>
  <div class="para">Para</div>
  <h1 id="nombreInicio"></h1>
  <button class="boton" id="abrir">Abrir mi regalo</button>
</section>

<header>
  <h2 id="titulo"></h2>
  <p id="contador"></p>
  <p class="pista">Toca cualquier foto ✨</p>
</header>

<main class="muro" id="muro"></main>

<div class="modal" id="modal">
  <div class="tarjeta" id="tarjeta">
    <img id="modalImg" alt="">
    <p class="mensaje" id="mensaje"></p>
    <p class="firma" id="firma"></p>
  </div>
  <div class="controles">
    <button class="ctrl cerrar" id="cerrar" aria-label="Cerrar">×</button>
    <button class="ctrl ant" id="ant" aria-label="Anterior">‹</button>
    <button class="ctrl sig" id="sig" aria-label="Siguiente">›</button>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);

  // Imagen de relleno si una foto no se encuentra
  const colores = [["#ffb3c8","#ff7aa8"],["#ffd6a5","#ff9a8b"],["#cdb4ff","#ff8fc7"],["#a0e7e5","#b4a0ff"]];
  function relleno(i) {
    const [a, b] = colores[i % colores.length];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
      <rect width="400" height="400" fill="url(#g)"/>
      <text x="200" y="215" font-size="120" text-anchor="middle" fill="#fff" opacity=".9">♥</text>
      <text x="200" y="300" font-size="28" text-anchor="middle" fill="#fff" font-family="sans-serif">foto ${i + 1}</text></svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  function ponerImagen(img, i) {
    img.onerror = () => { img.onerror = null; img.src = relleno(i); };
    img.src = FOTOS[i].foto;
  }

  // Textos
  $("nombreInicio").textContent = CONFIG.paraQuien;
  $("titulo").textContent = CONFIG.titulo;
  $("firma").textContent = "— " + CONFIG.firma;
  const inicio = new Date(CONFIG.fechaInicio + "T00:00:00");
  const dias = Math.floor((Date.now() - inicio) / 86400000);
  if (!isNaN(dias) && dias >= 0) {
    $("contador").innerHTML = `Llevamos <span class="contador">${dias} días</span> juntos ❤`;
  }

  // Corazones
  const cont = $("corazones");
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("span");
    s.textContent = "❤";
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 10 + Math.random() * 22 + "px";
    s.style.animationDuration = 9 + Math.random() * 12 + "s";
    s.style.animationDelay = Math.random() * 12 + "s";
    cont.appendChild(s);
  }

  // Muro de fotos
  const muro = $("muro");
  FOTOS.forEach((f, i) => {
    const card = document.createElement("figure");
    card.className = "polaroid";
    card.style.setProperty("--r", (Math.random() * 10 - 5).toFixed(1) + "deg");
    card.style.setProperty("--d", (i * 0.08).toFixed(2) + "s");
    const img = document.createElement("img");
    img.alt = f.pie || "Foto " + (i + 1);
    img.loading = "lazy";
    ponerImagen(img, i);
    const pie = document.createElement("figcaption");
    pie.className = "pie";
    pie.textContent = f.pie || "";
    card.append(img, pie);
    card.addEventListener("click", () => abrir(i));
    muro.appendChild(card);
  });

  // Pantalla de inicio
  $("abrir").addEventListener("click", () => {
    $("inicio").classList.add("oculto");
    document.querySelectorAll(".polaroid").forEach(p => p.classList.add("visible"));
  });

  // Ventana del mensaje
  let actual = 0, escritura = null;
  function escribir(texto) {
    clearInterval(escritura);
    const el = $("mensaje"), firma = $("firma");
    el.textContent = ""; firma.classList.remove("visible");
    let n = 0;
    escritura = setInterval(() => {
      el.textContent = texto.slice(0, ++n);
      if (n >= texto.length) { clearInterval(escritura); firma.classList.add("visible"); }
    }, 38);
  }
  function abrir(i) {
    actual = (i + FOTOS.length) % FOTOS.length;
    ponerImagen($("modalImg"), actual);
    $("modalImg").alt = FOTOS[actual].pie || "";
    $("modal").classList.add("abierto");
    escribir(FOTOS[actual].texto || "");
  }
  function cerrar() { $("modal").classList.remove("abierto"); clearInterval(escritura); }

  $("cerrar").addEventListener("click", cerrar);
  $("ant").addEventListener("click", () => abrir(actual - 1));
  $("sig").addEventListener("click", () => abrir(actual + 1));
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) cerrar(); });
  document.addEventListener("keydown", e => {
    if (!$("modal").classList.contains("abierto")) return;
    if (e.key === "Escape") cerrar();
    if (e.key === "ArrowLeft") abrir(actual - 1);
    if (e.key === "ArrowRight") abrir(actual + 1);
  });

  // Deslizar en el móvil
  let x0 = null;
  $("tarjeta").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  $("tarjeta").addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) abrir(actual + (dx < 0 ? 1 : -1));
    x0 = null;
  });
})();
</script>
</body>
</html>
